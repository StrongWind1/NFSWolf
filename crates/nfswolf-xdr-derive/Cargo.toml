[package]
name = "nfswolf-xdr-derive"
version.workspace = true
publish = false
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Derive macro for XDR (RFC 4506) Pack/Unpack encoding used by the NFSWolf protocol stack."
readme = "README.md"

[lib]
proc-macro = true

[dependencies]
proc-macro2 = "1"
quote = "1"
syn = { version = "3", features = ["full"] }

[dev-dependencies]
nfswolf-xdr = { workspace = true }
trybuild = "1"

[lints]
workspace = true
