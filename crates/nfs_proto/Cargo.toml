[package]
name = "nfs_proto"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Pure-Rust NFS wire protocol: XDR codec, ONC RPC v2, NFSv2/v3/v4, MOUNT, and portmapper."
keywords = ["nfs", "rpc", "xdr", "protocol", "onc-rpc"]
categories = ["network-programming", "encoding", "filesystem"]
readme = "README.md"

[dependencies]
nfswolf-xdr = { workspace = true }
nfswolf-rpc = { workspace = true }

# Randomised starting point for the privileged source-port scan, so repeated
# connections from one host do not always begin at the same port.
fastrand = "2"

[lints]
workspace = true
