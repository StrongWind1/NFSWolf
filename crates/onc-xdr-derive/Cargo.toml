[package]
name = "onc-xdr-derive"
version = "0.1.0"
publish = false
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Derive macro for XDR (RFC 4506) Pack/Unpack encoding used by the NFSWolf protocol stack."
readme.workspace = true
keywords = ["xdr", "derive", "onc", "rpc", "codec"]
categories = ["network-programming", "parser-implementations"]
include = ["src/**", "tests/**", "README.md", "NOTICE"]

[package.metadata.docs.rs]
rustdoc-args = ["--cfg", "docsrs"]

[lib]
proc-macro = true

[dependencies]
proc-macro2 = { workspace = true }
quote = { workspace = true }
syn = { workspace = true }

[dev-dependencies]
onc-xdr = { workspace = true }
trybuild = { workspace = true }

[lints]
workspace = true
