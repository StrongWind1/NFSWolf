[package]
name = "nfswolf-rpc"
version.workspace = true
publish = false
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "ONC RPC v2 (RFC 5531) client and a runtime-agnostic async transport layer."
readme = "README.md"

[dependencies]
nfswolf-xdr = { workspace = true }

# XID generation for RPC calls (RFC 5531 sec. 9).  fastrand is a tiny
# dependency-free PRNG -- no cryptographic strength is needed here.
fastrand = "2"

# Async runtime.  Only the tokio backend is provided; NFSWolf has no smol code
# path, so the upstream smol backend was dropped during absorption.
# Privileged source-port binding (the `secure` export option, RFC 2623
# sec. 2.3.1) goes through tokio's TcpSocket.
tokio = { version = "1", features = ["net", "io-util", "time", "sync"] }

[lints]
workspace = true
