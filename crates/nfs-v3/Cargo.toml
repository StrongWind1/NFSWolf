[package]
name = "nfs-v3"
version = "1.2.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/nfs-v3"
description = "NFS version 3 (RFC 1813): all 22 procedures, the MOUNT v3 protocol, and domain types over the raw wire format."
readme = "README.md"
keywords = ["nfs", "nfsv3", "rpc", "filesystem", "network"]
categories = ["network-programming", "parser-implementations"]
include = ["src/**", "README.md", "NOTICE"]

[package.metadata.docs.rs]
rustdoc-args = ["--cfg", "docsrs"]

[dependencies]
onc-xdr = { workspace = true }
onc-rpc-client = { workspace = true }
nfs-mount = { workspace = true }
tracing = { workspace = true }

[lints]
workspace = true
