name: Publish

"on":
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify-ci:
    name: Verify CI is green
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.event_name == 'release' && github.event.action == 'published'
    permissions:
      actions: read
      contents: read
    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify successful CI run for the release commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          release_sha="$(git rev-list -n 1 "refs/tags/${RELEASE_TAG}")"
          echo "Checking CI status for ${RELEASE_TAG} at ${release_sha}"
          conclusion="$(
            gh api \
              "repos/${REPOSITORY}/actions/workflows/ci.yml/runs?head_sha=${release_sha}&status=completed&event=push&per_page=1" \
              --jq '.workflow_runs[0].conclusion // ""'
          )"
          if [[ "${conclusion}" != "success" ]]; then
            echo "Required workflow ci.yml is not green for ${release_sha} (got: ${conclusion:-<none>})."
            exit 1
          fi

  publish:
    name: Publish to crates.io
    needs: verify-ci
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: always() && (needs.verify-ci.result == 'success' || needs.verify-ci.result == 'skipped')
    environment: crates-io
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        run: rustup show

      - name: Publish workspace crates in dependency order
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          set -euo pipefail

          publish_crate() {
            local crate="$1"
            local flags="${2:-}"
            echo "::group::Publishing ${crate}"
            cargo publish -p "${crate}" --locked ${flags}
            echo "::endgroup::"
            echo "Waiting for crates.io index propagation..."
            sleep 30
          }

          # Layer 1: proc macro (no workspace deps; --no-verify due to
          # circular dev-dep with onc-xdr)
          publish_crate onc-xdr-derive --no-verify

          # Layer 2: XDR codec
          publish_crate onc-xdr

          # Layer 3: RPC client
          publish_crate onc-rpc-client

          # Layer 4: rpcbind + MOUNT (both depend on layers 2-3, no cross-dep)
          publish_crate onc-rpcbind
          publish_crate nfs-mount

          # Layer 5: NFS version crates (no cross-deps between them)
          publish_crate nfs-v2
          publish_crate nfs-v3
          publish_crate nfs-v4

          # Layer 6: the binary
          publish_crate nfswolf

          echo "All 9 crates published successfully."
